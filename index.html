<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nihongo Study — 日本語</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F4C6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nihongo Study">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="description" content="Latihan Kanji, Kotoba, Bunpo, dan Dokkai N5/N4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Nihongo Study — design tokens
   Washi paper + ai-zome indigo + hanko seal red, carried over from the
   original quiz, extended with an ochre "gold" accent for streak/speed
   moments and a stamp-card motif for level progress.
   ========================================================================= */
:root{
  --bg:#F6F3EC;
  --card:#FFFDF8;
  --ink:#201E1B;
  --muted:#8B8074;
  --line:#DDD5C7;
  --indigo:#2F4C6B;
  --indigo-dark:#1F3450;
  --seal:#B33B49;
  --seal-dark:#8E2530;
  --moss:#3F6B4E;
  --amber:#C97C2C;
  --amber-dark:#9C5E1D;
  --moss-tint:#F1F7F3;
  --seal-tint:#FBF0F1;
  --radius:14px;
  --shadow-line:var(--line);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#1A1D22;
  --card:#23272E;
  --ink:#EDE8DE;
  --muted:#9098A8;
  --line:#363C46;
  --indigo:#7FA3D1;
  --indigo-dark:#5C82AD;
  --seal:#E2707C;
  --seal-dark:#C4525E;
  --moss:#7FBE92;
  --amber:#E5AC63;
  --amber-dark:#C68F45;
  --moss-tint:rgba(127,190,146,0.14);
  --seal-tint:rgba(226,112,124,0.14);
  color-scheme: dark;
}
html{ transition: background-color .25s ease; }
body, .qcard, .card, .flashface{ transition: background-color .25s ease, border-color .25s ease, color .25s ease; }
*{ box-sizing:border-box; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#app{
  position:relative; z-index:1;
  max-width:520px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column;
  padding: 18px 18px 48px;
}
h1,h2,h3{ font-family:'Shippori Mincho', serif; margin:0; }
a{ color:var(--indigo); }
button{ font-family:inherit; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.brand{
  font-family:'Shippori Mincho', serif; font-weight:700; font-size:19px;
}
.brand .jp{ color:var(--indigo); font-size:13px; letter-spacing:0.1em; display:block; margin-bottom:1px; }
.backbtn{
  background:none; border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; font-size:13px; color:var(--muted); cursor:pointer;
}
.backbtn:hover{ border-color:var(--indigo); color:var(--indigo); }

.topbar-actions{ display:flex; align-items:center; gap:8px; }
.themebtn{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:var(--card); border:1px solid var(--line); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px;
  color:var(--ink); line-height:1;
}
.themebtn:hover{ border-color:var(--indigo); }

/* ---------- Main menu (top level) ---------- */
.hero{ text-align:center; margin: 10px 0 22px; }
.hero .kanji-mark{ font-family:'Shippori Mincho', serif; font-size:34px; color:var(--indigo); margin-bottom:4px; }
.hero h1{ font-size:24px; margin-bottom:6px; }
.hero p{ color:var(--muted); font-size:13.5px; max-width:320px; margin:0 auto; line-height:1.5; }

.category-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:8px;
}
.category-tile{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 14px; text-align:left; cursor:pointer;
  display:flex; flex-direction:column; gap:10px; min-height:150px;
  position:relative; overflow:hidden;
}
.category-tile:active{ transform: scale(0.98); }
.category-tile .catmark{
  font-family:'Shippori Mincho', serif; font-size:30px; font-weight:700;
  width:48px; height:48px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--line);
}
.category-tile.c-kanji .catmark{ color:var(--indigo); border-color:var(--indigo); }
.category-tile.c-kotoba .catmark{ color:var(--moss); border-color:var(--moss); }
.category-tile.c-bunpo .catmark{ color:var(--amber-dark); border-color:var(--amber); }
.category-tile.c-dokkai .catmark{ color:var(--seal); border-color:var(--seal); }
.category-tile h3{ font-size:16px; margin:0; }
.category-tile p{ font-size:12px; color:var(--muted); margin:0; line-height:1.45; }
.category-tile .catstatus{
  position:absolute; top:14px; right:14px; font-size:9.5px; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px;
}
.catstatus.ready{ color:var(--moss); border:1px solid var(--moss); }
.catstatus.soon{ color:var(--muted); border:1px solid var(--line); }
.category-tile.disabled{ opacity:0.72; }

/* ---------- Coming soon placeholder ---------- */
.comingsoon{
  border:1.5px dashed var(--line); border-radius:16px; padding:36px 22px;
  text-align:center; flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
}
.comingsoon .mark{
  font-family:'Shippori Mincho', serif; font-size:44px; color:var(--muted);
  width:80px; height:80px; border-radius:50%; border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center; margin-bottom:6px;
}
.comingsoon h2{ font-size:18px; }
.comingsoon p{ color:var(--muted); font-size:13.5px; max-width:280px; line-height:1.6; }

.eyebrow{
  font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--indigo); font-weight:700; margin-bottom:6px;
}
.sub{ color:var(--muted); font-size:14px; margin-bottom:20px; line-height:1.55; }

/* ---------- Stamp card (level progress signature element) ---------- */
.stampcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:18px;
  display:flex; align-items:center; gap:14px;
}
.stampcard .slots{ display:flex; gap:10px; }
.stampslot{
  width:46px; height:46px; border-radius:50%;
  border:2px dashed var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho', serif; font-weight:700; font-size:15px;
  color:var(--line); flex-shrink:0; position:relative;
}
.stampslot.done{
  border:2px solid var(--seal); color:var(--seal);
  transform: rotate(-6deg);
}
.stampslot.current{ border-color:var(--indigo); color:var(--indigo); border-style:solid; }
.stampcard .label{ font-size:13px; color:var(--muted); line-height:1.5; }
.stampcard .label strong{ color:var(--ink); font-family:'Shippori Mincho', serif; font-size:15px; display:block; }

/* ---------- Home menu ---------- */
.modecard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; cursor:pointer; text-align:left; width:100%;
  display:flex; gap:14px; align-items:flex-start;
  transition: transform .15s ease;
}
.modecard:active{ transform: scale(0.98); }
.modecard:focus-visible, button:focus-visible, .opt:focus-visible, .levelrow:focus-visible{
  outline:3px solid var(--indigo); outline-offset:2px;
}
.modecard .icon{
  width:44px; height:44px; border-radius:12px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho', serif; font-size:22px; font-weight:700;
  background:var(--bg); border:1px solid var(--line); color:var(--indigo);
}
.modecard h3{ font-size:17px; margin-bottom:3px; }
.modecard p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.5; }
.modecard .tag{
  display:inline-block; margin-top:8px; font-size:10.5px; letter-spacing:0.08em;
  text-transform:uppercase; font-weight:700; padding:2px 9px; border-radius:999px;
}
.tag.tag-level{ color:var(--indigo); border:1px solid var(--indigo); }
.tag.tag-speed{ color:var(--amber-dark); border:1px solid var(--amber); }
.tag.tag-study{ color:var(--moss); border:1px solid var(--moss); }

/* ---------- Level picker rows ---------- */
.levelrow{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:10px; width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:12px;
}
.levelrow .num{
  width:38px; height:38px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho', serif; font-weight:700; font-size:16px;
  background:var(--bg); border:1px solid var(--line); color:var(--indigo);
}
.levelrow h4{ font-size:15px; margin:0 0 2px; font-family:'Shippori Mincho', serif; }
.levelrow p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.4; }
.levelrow.locked{ opacity:0.55; cursor:not-allowed; }
.levelrow .lockicon{ margin-left:auto; color:var(--muted); font-size:18px; }

/* ---------- Progress bar ---------- */
.progress-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.progress-track{ flex:1; height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--indigo); border-radius:99px; transition:width .35s ease; }
.progress-fill.speed{ background:var(--amber); }
.progress-label{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ---------- Timer ring (speed mode) ---------- */
.timerwrap{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.timerring{ position:relative; width:40px; height:40px; flex-shrink:0; }
.timerring svg{ transform: rotate(-90deg); }
.timerring circle.bg{ fill:none; stroke:var(--line); stroke-width:4; }
.timerring circle.fg{ fill:none; stroke:var(--amber); stroke-width:4; stroke-linecap:round; transition: stroke-dashoffset .2s linear, stroke .2s ease; }
.timerring.low circle.fg{ stroke:var(--seal); }
.timerring .num{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;
}
.streak{ font-size:13px; color:var(--amber-dark); font-weight:700; display:flex; align-items:center; gap:4px; }

/* ---------- Question card ---------- */
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:22px 20px; position:relative; overflow:hidden; flex:1;
  display:flex; flex-direction:column;
}
.qcard::before{
  content:"問"; position:absolute; top:-14px; right:-6px;
  font-family:'Shippori Mincho', serif; font-size:110px; color:var(--indigo);
  opacity:0.05; line-height:1; pointer-events:none;
}
.section-tag{
  font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--seal); margin-bottom:10px;
}
.kanji-big{ font-family:'Shippori Mincho', serif; font-size:56px; font-weight:700; line-height:1.1; margin:4px 0 6px; }
.q-desc{ font-size:17px; line-height:1.55; font-weight:500; margin:4px 0 6px; }
.q-hint{ color:var(--muted); font-size:13.5px; margin-bottom:16px; }

.options{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }
.opt{
  text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; font-size:16px; color:var(--ink); cursor:pointer;
  display:flex; align-items:center; gap:10px;
  transition: border-color .12s ease, background .12s ease, transform .08s ease;
}
.opt:active{ transform: scale(0.99); }
.opt .letter{
  width:26px; height:26px; border-radius:50%; background:var(--bg); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700;
  color:var(--muted); flex-shrink:0;
}
.opt.correct{ border-color:var(--moss); background:var(--moss-tint); }
.opt.correct .letter{ background:var(--moss); border-color:var(--moss); color:#fff; }
.opt.wrong{ border-color:var(--seal); background:var(--seal-tint); }
.opt.wrong .letter{ background:var(--seal); border-color:var(--seal); color:#fff; }
.opt.disabled{ cursor:default; }
.opt.dim{ opacity:0.5; }

.feedback{ margin-top:16px; font-size:14px; color:var(--muted); min-height:20px; }
.feedback.show-correct{ color:var(--moss); font-weight:700; }
.feedback.show-wrong{ color:var(--seal-dark); font-weight:700; }

.stamp{
  position:absolute; top:18px; right:18px; width:64px; height:64px; border-radius:50%;
  border:3px solid var(--seal); color:var(--seal); display:flex; align-items:center; justify-content:center;
  font-family:'Shippori Mincho', serif; font-weight:700; font-size:24px;
  opacity:0; transform:scale(1.6) rotate(-18deg); pointer-events:none;
}
.stamp.pop{ animation: stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards; }
.stamp.wrongstamp{ border-color:var(--indigo); color:var(--indigo); }
@keyframes stampIn{
  0%{ opacity:0; transform:scale(2.2) rotate(-18deg); }
  60%{ opacity:1; transform:scale(0.92) rotate(-10deg); }
  100%{ opacity:0.9; transform:scale(1) rotate(-10deg); }
}

.nextbar{ margin-top:16px; }
button.primary{
  width:100%; background:var(--indigo); color:#fff; border:none; border-radius:12px;
  padding:14px; font-size:16px; font-weight:700; cursor:pointer;
}
button.primary:active{ background:var(--indigo-dark); }
button.primary:disabled{ opacity:0.4; cursor:default; }
button.primary.amber{ background:var(--amber); }
button.primary.amber:active{ background:var(--amber-dark); }
button.ghost{
  width:100%; background:transparent; color:var(--indigo); border:1.5px solid var(--indigo);
  border-radius:12px; padding:12px; font-size:14.5px; font-weight:700; margin-top:10px; cursor:pointer;
}

/* ---------- Flashcard (tango card) mode ---------- */
.flash-progress{ text-align:center; font-size:12.5px; color:var(--muted); margin-bottom:10px; }
.flashzone{ flex:1; display:flex; align-items:center; justify-content:center; padding:10px 0 22px; perspective:1200px; }
.flashcard{
  width:100%; max-width:340px; height:230px; position:relative;
  cursor:pointer;
}
.flashcard .punch{
  position:absolute; top:10px; left:16px; width:12px; height:12px; border-radius:50%;
  background:var(--bg); border:1px solid var(--line); z-index:2;
}
.flashcard-inner{
  width:100%; height:100%; position:relative; transition: transform .5s;
  transform-style: preserve-3d;
}
.flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
.flashface{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius:14px; border:1px solid var(--line); background:var(--card);
  box-shadow: 6px 6px 0 var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center;
}
.flashface .topic{ position:absolute; top:14px; left:32px; font-size:11px; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
.flashface .kanji{ font-family:'Shippori Mincho', serif; font-size:46px; font-weight:700; }
.flashface .prompttext{ font-size:16px; line-height:1.5; }
.flashface.back{ transform: rotateY(180deg); }
.flashface .reading{ font-family:'Shippori Mincho', serif; font-size:26px; margin-bottom:6px; }
.flashface .meaning{ font-size:14px; color:var(--muted); }
.flashhint{ text-align:center; font-size:12px; color:var(--muted); margin-top:10px; }
.flashnav{ display:flex; gap:10px; margin-top:14px; }
.flashnav button{
  flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px; font-size:14px; color:var(--ink); cursor:pointer;
}
.flashnav button:active{ background:var(--bg); }

/* ---------- Result screen ---------- */
.result{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px 22px; text-align:center; }
.result .bigstamp{
  width:120px; height:120px; border-radius:50%; border:4px solid var(--seal); color:var(--seal);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:0 auto 18px; transform: rotate(-8deg); font-family:'Shippori Mincho', serif;
}
.result .bigstamp.amber{ border-color:var(--amber); color:var(--amber-dark); }
.result .bigstamp .score-num{ font-size:34px; font-weight:700; line-height:1; }
.result .bigstamp .score-den{ font-size:13px; }
.result h2{ font-size:22px; margin:0 0 6px; }
.result p{ color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.6; }
.breakdown{ display:flex; justify-content:center; gap:18px; margin-bottom:22px; flex-wrap:wrap; }
.breakdown div{ font-size:13px; color:var(--muted); }
.breakdown strong{ display:block; font-size:20px; color:var(--ink); font-family:'Shippori Mincho', serif; }
.passbadge{
  display:inline-block; margin-bottom:14px; padding:5px 14px; border-radius:999px;
  font-size:12.5px; font-weight:700; letter-spacing:0.04em;
}
.passbadge.pass{ background:var(--moss-tint); color:var(--moss); border:1px solid var(--moss); }
.passbadge.retry{ background:var(--seal-tint); color:var(--seal-dark); border:1px solid var(--seal); }

.footer-note{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:22px; line-height:1.6; }


/* ---------- Furigana & Kotoba setup ---------- */
ruby{ ruby-align:center; }
ruby rt{ font-size:max(.42em, 9px); font-weight:500; color:var(--muted); font-family:'Noto Sans JP', sans-serif; letter-spacing:0; }
body.nofuri ruby rt{ display:none; }
.noruby ruby rt{ display:none !important; }
.forceruby ruby rt{ display:ruby-text !important; }
.kanji-big.sz-m{ font-size:34px; }
.kanji-big.sz-s{ font-size:24px; line-height:1.6; }
.flashface .kanji.sz-m{ font-size:30px; }
.flashface .kanji.sz-s{ font-size:21px; line-height:1.6; }
.q-desc.q-meaning{ font-size:20px; margin:8px 0 10px; }
.flashface .meaningfront{ font-size:19px; font-weight:600; line-height:1.5; }
.flashface .meaning.big{ font-size:18px; color:var(--ink); }
.wordinfo{ margin-top:6px; font-size:14px; color:var(--ink); font-weight:500; }

.toolrow{ display:flex; justify-content:flex-end; margin:-6px 0 10px; }
.furibtn, .pill{
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; font-size:13px; color:var(--muted); cursor:pointer;
}
.furibtn.on{ border-color:var(--moss); color:var(--moss); background:var(--moss-tint); }
.pill:hover{ border-color:var(--indigo); color:var(--indigo); }

.setupsec{ margin:18px 0; }
.setuplabel{ font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--seal); margin-bottom:8px; }
.seg{ display:flex; gap:8px; }
.segbtn{
  flex:1; padding:11px 8px; border:1.5px solid var(--line); border-radius:12px;
  background:var(--card); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
}
.segbtn.on{ border-color:var(--indigo); color:var(--indigo); box-shadow:0 0 0 1px var(--indigo); }
.quickrow{ display:flex; gap:8px; margin-bottom:10px; }
.chips{ display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
.chip{
  padding:11px 0; border:1.5px solid var(--line); border-radius:12px; background:var(--card);
  color:var(--ink); font-size:15px; font-weight:700; cursor:pointer;
  font-family:'Shippori Mincho', serif;
}
.chip.on{ background:var(--indigo); border-color:var(--indigo); color:var(--bg); }
.rangerow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; font-size:13.5px; color:var(--muted); }
.rangerow select{
  padding:8px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:14px;
}
.selsum{ font-size:13px; color:var(--muted); margin-top:10px; }
.selsum strong{ color:var(--ink); }
.switchrow{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 14px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; font-size:14.5px; cursor:pointer;
}
.switchrow small{ display:block; color:var(--muted); font-size:12px; margin-top:2px; line-height:1.4; }
.switchrow input{ width:22px; height:22px; accent-color:var(--indigo); flex-shrink:0; }
.levelrow.on{ border-color:var(--indigo); box-shadow:0 0 0 1px var(--indigo); }
.topbar-actions .backbtn{ padding:6px 11px; }

/* ---- kanji dari buku & simulasi ---- */
.kjopt{ font-family:'Shippori Mincho', serif; font-size:20px; }
.kjback{ text-align:left; justify-content:flex-start; padding-top:34px; overflow:auto; }
.kjrow{ display:flex; gap:10px; font-size:14px; margin:4px 0; width:100%; }

.kjrow .en{ color:var(--muted); font-style:normal; font-size:12px; }
.kjexwrap{ margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; width:100%; }
.kjex{ display:flex; justify-content:space-between; gap:8px; font-size:15px; margin:3px 0; }
.kjex small{ color:var(--muted); font-size:12px; text-align:right; }
.simbadge{ font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 9px; white-space:nowrap; align-self:center; }
.simbadge.ok{ color:var(--moss); border-color:var(--moss); }
.simbar{ position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px; font-size:13px; }
.simclock{ font-family:monospace; font-size:20px; font-weight:700; color:var(--indigo); }
.simclock.low{ color:var(--seal); }
.simpart{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
.simhead{ font-size:14px; font-weight:700; line-height:1.6; }
.simsub{ font-size:12.5px; color:var(--muted); margin:2px 0 10px; }
.simq{ border-top:1px dashed var(--line); padding:12px 0 6px; }
.simsent{ font-size:17px; line-height:1.8; }
.simno{ display:inline-block; min-width:24px; height:24px; line-height:22px; text-align:center; border:1px solid var(--ink); border-radius:4px; font-size:13px; margin-right:8px; }
.simu{ text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1.5px; }
.simopts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.simopt{ text-align:left; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-size:16px; cursor:pointer; font-family:inherit; }
.simopt span{ display:inline-block; width:20px; color:var(--muted); font-size:13px; }
.simopt.on{ border-color:var(--indigo); background:var(--indigo); color:#fff; }
.simopt.on span{ color:#fff; }
.simrev{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--moss); border-radius:10px; padding:10px 12px; margin-bottom:8px; }

.simrevline{ font-size:14px; margin-top:4px; }

/* =========================================================================
   V2 — beranda, koin, toko gacha, koleksi, kosmetik
   ========================================================================= */
#bgLayer{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#app.hasnav{ padding-bottom:104px; }
.rar-d{ --rc:var(--muted); } .rar-c{ --rc:#8E949C; } .rar-u{ --rc:#3FA34D; } .rar-r{ --rc:#3B82F6; } .rar-e{ --rc:#A855F7; } .rar-l{ --rc:#F59E0B; }

/* ---- top bar ---- */
.tb-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.iconbtn{
  width:36px; height:36px; border-radius:50%; flex-shrink:0; background:var(--card);
  border:1px solid var(--line); color:var(--ink); font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.iconbtn:hover{ border-color:var(--indigo); color:var(--indigo); }
.coinpill{
  display:flex; align-items:center; gap:6px; height:34px; padding:0 12px 0 8px; border-radius:999px;
  background:var(--card); border:1px solid var(--line); color:var(--ink); font-weight:700; font-size:14px;
  cursor:pointer; font-variant-numeric:tabular-nums;
}
.coinpill.static{ cursor:default; }
.coin{
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  font-size:18px; width:1em; height:1em; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FFE9A0, #E9B62F 60%, #C48A12); border:1px solid #B07A0C;
}
.coin::before{ content:"円"; font-family:'Shippori Mincho', serif; font-size:.58em; font-weight:700; color:#7A5200; line-height:1; }
.coin.lg{ font-size:28px; }

/* ---- beranda ---- */
.profile{
  display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:16px; margin-bottom:10px;
}
.avatarbtn{ background:none; border:none; padding:0; cursor:pointer; }
.avatar{
  display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
  background:var(--bg); border:3px solid var(--rc, var(--line)); font-size:22px; line-height:1; flex-shrink:0;
}
.avatar.lg{ width:64px; height:64px; font-size:32px; }
.avatar.xl{ width:92px; height:92px; font-size:46px; border-width:4px; }
.avatar.rar-e{ border-color:transparent; background:linear-gradient(var(--bg),var(--bg)) padding-box, linear-gradient(135deg,#A855F7,#EC4899,#6366F1) border-box; }
.avatar.rar-l{
  border-color:transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box, conic-gradient(#F59E0B,#FDE68A,#F97316,#FDE68A,#F59E0B) border-box;
  animation:ringGlow 1.8s ease-in-out infinite alternate;
}
@keyframes ringGlow{ from{ box-shadow:0 0 4px rgba(245,158,11,.35); } to{ box-shadow:0 0 16px rgba(245,158,11,.8); } }
.pf-hello{ font-size:12px; color:var(--indigo); letter-spacing:.08em; font-weight:700; }
.pf-title{ font-family:'Shippori Mincho', serif; font-size:21px; font-weight:700; margin:1px 0 4px; }
.pf-daily{ font-size:12.5px; color:var(--amber-dark); line-height:1.4; }
.pf-daily.done{ color:var(--moss); }
.statrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.statbox{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px 10px; text-align:center; }
.statbox b{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:21px; font-family:'Shippori Mincho', serif; font-variant-numeric:tabular-nums; }
.statbox small{ color:var(--muted); font-size:11.5px; }
.sectitle{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:4px 2px 10px; }
.category-tile{ min-height:132px; padding:16px 14px; color:var(--ink); }
.category-tile .meta{ font-size:11.5px; color:var(--indigo); font-weight:700; margin-top:4px; }
.shopbanner{
  display:flex; gap:16px; align-items:center; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; color:var(--ink);
}
.shopbanner h3{ font-size:16px; margin-bottom:2px; }
.shopbanner p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.45; }
.minibar{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin:8px 0 3px; }
.minibar i{ display:block; height:100%; background:var(--accent-bg, var(--indigo)); border-radius:99px; }
.minilabel{ font-size:11.5px; color:var(--muted); }
.welcome{ background:var(--moss-tint); border:1px solid var(--moss); color:var(--moss); border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px; line-height:1.45; }

/* ---- navigasi bawah ---- */
.bottomnav{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:520px; z-index:20;
  display:flex; gap:6px; background:var(--card); border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
}
.navbtn{
  flex:1; background:none; border:none; border-radius:12px; padding:6px 4px 5px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:700; color:var(--muted);
}
.navbtn span{ font-family:'Shippori Mincho', serif; font-size:20px; line-height:1.15; }
.navbtn.on{ color:var(--indigo); background:color-mix(in srgb, var(--indigo) 12%, transparent); }

/* ---- hadiah di layar hasil ---- */
.reward{
  border:1.5px solid #E9B62F; background:color-mix(in srgb, #F4C63D 14%, var(--card)); border-radius:14px;
  padding:12px 14px; margin:0 0 18px; text-align:left;
}
.reward .rw-top{ display:flex; align-items:center; gap:8px; font-family:'Shippori Mincho', serif; font-size:20px; font-weight:700; color:var(--ink); }
.reward .rw-top small{ margin-left:auto; font-family:'Zen Kaku Gothic New', sans-serif; font-size:12px; font-weight:500; color:var(--muted); }
.reward ul{ margin:8px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--muted); line-height:1.7; }
.reward li{ display:flex; justify-content:space-between; gap:10px; }
.reward li b{ color:var(--ink); font-variant-numeric:tabular-nums; }

/* ---- toko ---- */
.balance{
  display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 16px; margin-bottom:14px; font-size:14px; color:var(--muted);
}
.balance b{ font-family:'Shippori Mincho', serif; font-size:26px; color:var(--ink); font-variant-numeric:tabular-nums; }
.shopcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.shop-top{ display:flex; gap:16px; align-items:center; }
.shop-info{ flex:1; min-width:0; }
.shop-info h3{ font-size:17px; margin-bottom:2px; }
.shop-info p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.45; }
.shop-actions{ display:flex; gap:10px; margin-top:14px; }
.shop-actions button{ margin-top:0; flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 8px; font-size:14.5px; }
.oddsbox{ margin-top:14px; border-top:1px dashed var(--line); padding-top:10px; }
.oddsrow{ margin-bottom:10px; }
.oddsrow .oh{ display:flex; justify-content:space-between; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--rc); margin-bottom:6px; }
.oddsitems{ display:flex; flex-wrap:wrap; gap:6px; }
.oddsitem{ display:inline-flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:3px 9px 3px 4px; color:var(--ink); background:var(--bg); }
.oddsitem.own{ border-color:var(--rc); }
.oddsitem .pv{ width:20px; height:20px; font-size:12px; border-width:1.5px; }
.oddsnote{ font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:4px; }
.infobox{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:6px; font-size:13px; line-height:1.6; color:var(--ink); }
.infobox b{ font-family:'Shippori Mincho', serif; font-size:15px; }
.infobox ul{ margin:6px 0 0; padding-left:18px; color:var(--muted); }
.infobox summary{ cursor:pointer; font-weight:700; }
.infobox textarea{ width:100%; margin:8px 0 6px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); padding:8px; font-family:monospace; font-size:11px; resize:vertical; }
.infobox p{ margin:8px 0 0; color:var(--muted); }
#bkMsg{ font-size:12.5px; margin-top:6px; font-weight:700; }

/* ---- chest ---- */
.chest{ --cc:#C97C2C; --cd:#8F5516; position:relative; width:6.4em; height:5.4em; font-size:10px; flex-shrink:0; }
.chest.k-warna{ --cc:#E5484D; --cd:#9E2A2E; } .chest.k-tampilan{ --cc:#3D6591; --cd:#1F3450; }
.chest.k-icon{ --cc:#4C9A6A; --cd:#2A6442; } .chest.k-bg{ --cc:#D08A32; --cd:#8F5516; }
.chest .lid{
  position:absolute; left:0; right:0; top:0; height:2.4em; background:var(--cc); border:.25em solid var(--cd);
  border-radius:1.4em 1.4em .2em .2em; transform-origin:0% 100%; transition:transform .35s cubic-bezier(.2,1.4,.4,1); z-index:2;
}
.chest .box{ position:absolute; left:0; right:0; bottom:0; height:3.2em; background:var(--cc); border:.25em solid var(--cd); border-radius:.2em .2em .9em .9em; overflow:hidden; }
.chest .box::after, .chest .lid::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent 12%, rgba(255,255,255,.25) 12% 20%, transparent 20% 80%, rgba(255,255,255,.25) 80% 88%, transparent 88%);
}
.chest .lock{ position:absolute; left:50%; top:1.75em; width:1.4em; height:1.8em; margin-left:-.7em; background:#F4D35E; border:.22em solid var(--cd); border-radius:.35em; z-index:3; transition:opacity .2s; }
.chest.big{ font-size:22px; }
.chest.shake{ animation:chestShake 1s ease-in-out; }
.chest.open .lid{ transform:rotate(-32deg) translateY(-.3em); }
.chest.open .lock{ opacity:0; }
@keyframes chestShake{
  0%,100%{ transform:rotate(0); } 15%{ transform:rotate(-7deg); } 30%{ transform:rotate(7deg); }
  45%{ transform:rotate(-7deg) scale(1.04); } 60%{ transform:rotate(7deg) scale(1.06); }
  75%{ transform:rotate(-5deg) scale(1.08); } 90%{ transform:rotate(4deg) scale(1.1); }
}

/* ---- overlay gacha ---- */
.gacha{ position:fixed; inset:0; z-index:100; background:rgba(15,17,22,.74); display:flex; align-items:center; justify-content:center; padding:20px; }
.gacha-box{ width:100%; max-width:340px; background:var(--card); border-radius:22px; padding:24px 20px 20px; text-align:center; border:2px solid var(--line); color:var(--ink); }
.gacha-box.revealed{
  border-color:var(--rc);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--rc) 25%, transparent), 0 0 44px color-mix(in srgb, var(--rc) 60%, transparent);
  animation:popIn .4s cubic-bezier(.2,1.4,.4,1);
}
@keyframes popIn{ from{ transform:scale(.86); } to{ transform:scale(1); } }
.gacha-stage{ display:flex; justify-content:center; padding:30px 0 34px; }
.gacha-box.revealed .gacha-stage{ padding:36px 0 10px; }
.gacha-box.revealed .chest.big{ font-size:10px; }
.gacha-title{ font-size:13px; color:var(--muted); }
.gacha-rar{ font-size:12px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:var(--rc); }
.gacha-prev{ display:flex; justify-content:center; margin:14px 0 10px; }
.gacha-name{ font-family:'Shippori Mincho', serif; font-size:22px; font-weight:700; }
.gacha-note{ font-size:13px; color:var(--muted); margin:6px 0 16px; line-height:1.5; }
.gacha-note b{ color:var(--moss); }
.gacha-box button.ghost{ display:flex; align-items:center; justify-content:center; gap:8px; }

/* ---- pratinjau item ---- */
.pv{ display:inline-flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:50%; flex-shrink:0; position:relative; overflow:hidden; border:2px solid var(--line); font-size:22px; line-height:1; }
.pv.xl{ width:96px; height:96px; font-size:46px; border-width:3px; }
.pv.bgwrap, .pv.uiprev{ border-radius:12px; background:var(--bg); }
.pv.bgwrap i{ position:absolute; inset:0; }
.pv.sw{ border-color:transparent; }
.pv.ic{ background:var(--bg); border-color:var(--rc, var(--line)); }
.uiprev-card{ width:70%; height:62%; display:flex; align-items:center; justify-content:center; background:var(--card); border:1px solid var(--line); border-radius:6px; font-style:normal; font-weight:700; font-size:.6em; color:var(--ink); }

/* ---- koleksi ---- */
.invtabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
.invtabs .segbtn{ padding:9px 2px; font-size:12.5px; }
.invtabs .segbtn small{ display:block; font-size:10.5px; color:var(--muted); font-weight:500; }
.invgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.invitem{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px 10px; min-height:118px;
  display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; color:var(--ink); position:relative; font-size:12.5px; line-height:1.25;
}
.invitem small{ font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--rc); }
.invitem.locked{ cursor:default; }
.invitem.locked .pv, .invitem.locked .nm{ opacity:.35; filter:grayscale(1); }
.invitem.on{ border-color:var(--indigo); box-shadow:0 0 0 2px var(--indigo); }
.invitem .badge{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); background:var(--accent-bg, var(--indigo)); color:var(--on-accent, #fff); font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap; }

/* ---- aksen: pakai variabel agar bisa diganti item Warna ---- */
button.primary{ background:var(--accent-bg, var(--indigo)); color:var(--on-accent, #fff); }
.progress-fill{ background:var(--accent-bg, var(--indigo)); }
.chip.on{ background:var(--accent-bg, var(--indigo)); color:var(--on-accent, var(--bg)); }
.simopt.on{ background:var(--accent-bg, var(--indigo)); color:var(--on-accent, #fff); }
.simopt.on span{ color:var(--on-accent, #fff); }
.acc-anim button.primary:not(.amber), .acc-anim .progress-fill:not(.speed), .acc-anim .chip.on, .acc-anim .simopt.on, .acc-anim .minibar i, .acc-anim .invitem .badge, .pv.sw.anim{
  background-size:300% 100%; animation:accShift 5s ease-in-out infinite alternate;
}
@keyframes accShift{ from{ background-position:0% 0; } to{ background-position:100% 0; } }

/* ---- TAMPILAN: gaya kartu & tombol ---- */
.uiscope{
  --c-radius:14px; --b-radius:12px; --c-bw:1px; --c-bs:solid; --c-bc:var(--line); --c-shadow:none;
  --c-bg:var(--card); --c-filter:none; --b-shadow:none; font-family:'Zen Kaku Gothic New', sans-serif;
}
.ui-bulat{ --c-radius:26px; --b-radius:999px; }
.ui-kotak{ --c-radius:3px; --b-radius:3px; }
.ui-tegas{ --c-bw:2px; --c-bc:var(--ink); }
.ui-putus{ --c-bs:dashed; --c-bw:1.5px; --c-bc:var(--muted); }
.ui-lembut{ --c-bc:transparent; --c-shadow:0 6px 20px rgba(0,0,0,.09); --c-radius:18px; }
.ui-mincho{ --c-radius:8px; --b-radius:8px; font-family:'Shippori Mincho', serif; }
.ui-maru{ --c-radius:22px; --b-radius:18px; font-family:'Zen Maru Gothic', 'Zen Kaku Gothic New', sans-serif; }
.ui-aksen{ --c-shadow:inset 5px 0 0 var(--indigo); --c-radius:10px; }
.ui-kaca{ --c-bg:color-mix(in srgb, var(--card) 55%, transparent); --c-filter:blur(12px) saturate(1.4); --c-bc:color-mix(in srgb, var(--ink) 16%, transparent); --c-shadow:0 8px 24px rgba(0,0,0,.08); --c-radius:18px; }
.ui-brutal{ --c-bw:2px; --c-bc:var(--ink); --c-shadow:4px 4px 0 var(--ink); --c-radius:8px; --b-radius:8px; --b-shadow:3px 3px 0 var(--ink); }
.ui-tumpuk{ --c-shadow:4px 5px 0 -1px var(--card), 4px 5px 0 0 var(--line), 8px 10px 0 -1px var(--card), 8px 10px 0 0 var(--line); --c-radius:10px; }
.ui-neon{ --c-bc:var(--indigo); --c-shadow:0 0 0 1px var(--indigo), 0 0 16px color-mix(in srgb, var(--indigo) 60%, transparent); }
.ui-gradien{ --c-bg:linear-gradient(135deg, var(--card) 30%, color-mix(in srgb, var(--indigo) 20%, var(--card))); --c-bc:color-mix(in srgb, var(--indigo) 35%, var(--line)); --c-radius:18px; }
.ui-kintsugi{ --c-bw:2px; --c-bc:transparent; --c-shadow:0 2px 14px rgba(201,162,39,.3);
  --c-bg:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(120deg,#9C7A12,#FFE9A0,#C9A227,#FFF3C4,#9C7A12,#FFE9A0,#9C7A12) border-box; }
.ui-hologram{ --c-bw:2px; --c-bc:transparent; --c-shadow:0 2px 16px rgba(140,120,255,.3); --c-radius:18px;
  --c-bg:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(120deg,#FF6B9A,#FFC14D,#5EE6A8,#4DB8FF,#A77BFF,#FF6B9A,#FFC14D) border-box; }
.uiscope :is(.modecard,.levelrow,.qcard,.result,.category-tile,.shopcard,.profile,.statbox,.shopbanner,.simpart,.invitem,.infobox,.balance,.uiprev-card){
  border-radius:var(--c-radius); border-width:var(--c-bw); border-style:var(--c-bs); border-color:var(--c-bc);
  box-shadow:var(--c-shadow); background:var(--c-bg); -webkit-backdrop-filter:var(--c-filter); backdrop-filter:var(--c-filter);
}

  return VOCAB.filter(w => w.b === b && s.has(w.l));
}
function escHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
/* furigana per kata utuh: <ruby>kanji<rt>kana</rt></ruby> */
function rubyHTML(w) {
  return w.hasK ? `<ruby>${escHTML(w.jp)}<rt>${escHTML(w.k)}</rt></ruby>` : escHTML(w.k);
}
function sizeClass(len) { return len > 14 ? "sz-s" : len > 8 ? "sz-m" : ""; }
function groupLabel(w) { return w.g ? `Kata kerja Kel. ${["", "I", "II", "III"][w.g]}` : ""; }

const DIR_META = {
  kana: { label: "Kanji → Baca",  hint: "Pilih bacaan (kana) yang tepat" },
  arti: { label: "Jepang → Arti", hint: "Pilih arti yang tepat" },
  jp:   { label: "Arti → Jepang", hint: "Pilih kata Jepang yang tepat" },
  mix:  { label: "Campur",        hint: "" },
};
function keyOf(w, d)  { return d === "kana" ? w.k : d === "arti" ? w.a : w.jp; }
function htmlOf(w, d) { return d === "kana" ? escHTML(w.k) : d === "arti" ? escHTML(w.a) : rubyHTML(w); }

/* 3 pengecoh: utamakan jenis yang mirip (ungkapan/kata kerja/panjang) dan teks unik */
function pickDistractors(w, d, pool) {
  const ck = keyOf(w, d);
  const isVerb = w.g > 0;
  const seen = new Set([ck]);
  const out = [];
  const rank = (x) => (x.u !== w.u ? 4 : 0) + ((x.g > 0) !== isVerb ? 2 : 0) +
    (Math.abs(keyOf(x, d).length - ck.length) > 4 ? 1 : 0);
  const take = (list) => {
    const cands = shuffle(list).filter(x => x.id !== w.id)
      .map(x => [rank(x), x]).sort((a, b) => a[0] - b[0]);
    for (const [, x] of cands) {
      if (out.length >= 3) break;
      const k = keyOf(x, d);
      if (seen.has(k)) continue;
      seen.add(k); out.push(x);
    }
  };
  take(pool);
  if (out.length < 3) take(VOCAB);
  return out;
}

function buildKotobaQuestions(words, dir, count, pool) {
  let list = dir === "kana" ? words.filter(w => w.hasK) : words.slice();
  list = shuffle(list);
  if (count > 0) list = list.slice(0, count);
  return list.map(w => {
    const d = dir === "mix"
      ? (w.hasK ? ["kana", "arti", "jp"] : ["arti", "jp"])[Math.floor(Math.random() * (w.hasK ? 3 : 2))]
      : dir;
    const ds = pickDistractors(w, d, pool || words);
    const optHTML = {};
    const options = shuffle([w, ...ds]).map(x => { const k = keyOf(x, d); optHTML[k] = htmlOf(x, d); return k; });
    const sz = sizeClass(w.jp.length);
    const promptHTML = d === "kana"
      ? `<div class="kanji-big noruby ${sz}">${rubyHTML(w)}</div>`
      : d === "arti"
      ? `<div class="kanji-big ${sz}">${rubyHTML(w)}</div>`
      : `<div class="q-desc q-meaning">${escHTML(w.a)}</div>`;
    return {
      type: "kotoba", dir: d, src: w,
      topic: `Pelajaran ${w.l}${w.g ? " · " + groupLabel(w) : ""}`,
      promptHTML, hint: DIR_META[d].hint,
      correct: keyOf(w, d), options, optHTML,
    };
  });
}
</script>
<script>
/* =========================================================================
   Kanji Quiz Advance — app logic
   Semua state di memori (tidak ada localStorage), reset saat halaman di-reload.
   ========================================================================= */

const QUIZ_SIZE_LEVEL = 12;   // jumlah soal per ronde Kuis Bertahap
const QUIZ_SIZE_SPEED = 15;   // jumlah soal per ronde Mode Kecepatan
const TIME_LIMIT = 12;        // detik per soal, Mode Kecepatan
const PASS_SCORE = 0.7;       // ambang lulus per level

const state = {
  screen: "main-menu",
  theme: (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light",
  mode: null,          // 'level' | 'speed' | 'flash'
  level: null,
  speedPool: null,     // 1 | 2 | 3 | 'all'
  progress: { 1:{passed:false,best:0}, 2:{passed:false,best:0}, 3:{passed:false,best:0} },

  sessionQuestions: [],
  idx: 0,
  score: 0,
  correctCount: 0,
  answered: false,
  streak: 0,
  maxStreak: 0,

  timerId: null,
  timeLeft: TIME_LIMIT,

  flashDeck: [],
  flashIdx: 0,
  flashFlipped: false,

  kBook: "MNN1", kMode: "flash", kSel: [1], kDir: "arti", kFront: "jp", kFuri: true, kCount: 20, kShuffle: true,
  kFrom: 1, kTo: 8, kWrong: [],
};

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
}
function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  SAVE.theme = state.theme; saveSave();
  applyTheme();
  render();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickSession(pool, n) {
  return shuffle(pool).slice(0, Math.min(n, pool.length)).map(q => ({
    ...q,
    options: shuffle([q.correct, ...q.distractors]),
  }));
}
function clearTimer() {
  if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
}
function nextLevelNum() {
  for (const lv of LEVELS) if (!state.progress[lv.num].passed) return lv.num;
  return null; // semua sudah lulus
}

/* ================= ROUTING ================= */
function goMainMenu() { clearTimer(); state.screen = "main-menu"; render(); }
function goKanjiHome() { clearTimer(); state.screen = "kanji-home"; render(); }
function goHome() { goKanjiHome(); } // alias dipakai layar hasil kuis/flashcard
function goFlashPick() { state.screen = "flash-pick"; render(); }
function goLevelPick() { state.screen = "level-pick"; render(); }
function goSpeedPick() { state.screen = "speed-pick"; render(); }
function goPlaceholder(section) { state.screen = section + "-home"; render(); }

function startFlashcards(level) {
  state.mode = "flash";
  state.level = level;
  state.flashDeck = shuffle(getFlashcardableByLevel(level));
  state.flashIdx = 0;
  state.flashFlipped = false;
  state.screen = "flashcard";
  render();
}

function startLevelQuiz(level) {
  state.mode = "level";
  state.level = level;
  state.sessionQuestions = pickSession(getQuestionsByLevel(level), QUIZ_SIZE_LEVEL);
  state.idx = 0; state.score = 0; state.correctCount = 0; state.answered = false;
  state.streak = 0; state.maxStreak = 0;
  state.screen = "quiz";
  render();
}

function startSpeedQuiz(pool) {
  state.mode = "speed";
  state.speedPool = pool;
  const words = speedWords(pool);
  if (words.length < 4) return;
  state.sessionQuestions = buildKBookQuestions(words, "mix", QUIZ_SIZE_SPEED).map(q => ({ ...q, topic: `${KJ_BOOK_NAME[["MNN1","MNN2","Irodori","Irodori1","Irodori2"][q.src.b - 1]]} · Pel. ${q.src.l} · ${KJ_DIR[q.dir].label}` }));
  state.idx = 0; state.score = 0; state.correctCount = 0; state.answered = false;
  state.streak = 0; state.maxStreak = 0;
  state.screen = "quiz";
  render();
  startTimerForCurrentQuestion();
}

/* ---------- KOTOBA: preferensi, routing, mulai sesi ---------- */
const PREF_KEY = "mnnKotobaPrefs.v1";
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
    if (!p) { setKBook(state.kBook); return; }
    if (p.kBook === "MNN1" || p.kBook === "MNN2" || p.kBook === "Irodori" || p.kBook === "Irodori1" || p.kBook === "Irodori2") { state.kBook = p.kBook; state.kSel = Array.isArray(p.kSel) ? p.kSel : state.kSel; }
    setKBook(state.kBook);
    if (p.kMode === "flash" || p.kMode === "quiz") state.kMode = p.kMode;
    if (Array.isArray(p.kSel)) state.kSel = p.kSel.filter(n => KOTOBA_LESSONS.includes(n));
    if (!state.kSel.length) state.kSel = [KOTOBA_LESSONS[0]];
    if (DIR_META[p.kDir]) state.kDir = p.kDir;
    if (p.kFront === "jp" || p.kFront === "id") state.kFront = p.kFront;
    if (typeof p.kFuri === "boolean") state.kFuri = p.kFuri;
    if ([0, 10, 20, 30].includes(p.kCount)) state.kCount = p.kCount;
    if (typeof p.kShuffle === "boolean") state.kShuffle = p.kShuffle;
  } catch (e) { /* localStorage tidak tersedia: abaikan */ }
  if (!KOTOBA_LESSONS.length) setKBook(state.kBook);
}
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      kBook: state.kBook, kMode: state.kMode, kSel: state.kSel, kDir: state.kDir, kFront: state.kFront,
      kFuri: state.kFuri, kCount: state.kCount, kShuffle: state.kShuffle,
    }));
  } catch (e) { /* abaikan */ }
}
function applyFuri() { document.body.classList.toggle("nofuri", !state.kFuri); }

function lessonsLabel(arr) {
  const a = [...arr].sort((x, y) => x - y);
  if (!a.length) return "—";
  const parts = [];
  let s = a[0], p = a[0];
  for (let i = 1; i <= a.length; i++) {
    const v = a[i];
    if (v === p + 1) { p = v; continue; }
    parts.push(s === p ? `${s}` : `${s}–${p}`);
    s = v; p = v;
  }
  return parts.join(", ");
}
function selectedWords() { return vocabByLessons(state.kSel); }

function goKotobaHome() { clearTimer(); state.screen = "kotoba-home"; render(); }
function goKotobaSetup() { if (!KOTOBA_LESSONS.length) setKBook(state.kBook); clearTimer(); state.screen = "kotoba-setup"; render(); }

/* tombol Kembali: naik satu tingkat, pengaturan terakhir tetap tersimpan */
function goBack() {
  clearTimer();
  const s = state.screen;
  const map = {
    "shop": "main-menu", "inventory": "main-menu",
    "kanji-home": "main-menu", "kotoba-home": "main-menu", "bunpo-home": "main-menu", "dokkai-home": "main-menu",
    "flash-pick": "kanji-home", "level-pick": "kanji-home", "speed-pick": "kanji-home",
    "kotoba-setup": "kotoba-home", "kotoba-result": "kotoba-setup",
    "kbook-setup": "kanji-home", "kbook-result": "kbook-setup", "sim-home": "kanji-home", "sim-test": "sim-home", "sim-result": "sim-home",
  };
  let to = map[s];
  if (!to && s === "flashcard") to = state.mode === "kotoba-flash" ? "kotoba-setup" : state.mode === "kbook-flash" ? "kbook-setup" : "flash-pick";
  if (!to && s === "quiz") to = state.mode === "kotoba-quiz" ? "kotoba-setup" : state.mode === "kbook-quiz" ? "kbook-setup" : state.mode === "speed" ? "speed-pick" : "level-pick";
  if (!to && s === "result") to = state.mode === "speed" ? "speed-pick" : "level-pick";
  state.screen = to || "main-menu";
  render();
}

function startKotobaFlashcard() {
  const words = selectedWords();
  if (!words.length) return;
  state.mode = "kotoba-flash";
  state.flashDeck = (state.kShuffle ? shuffle(words) : words).map(w => ({ w }));
  state.flashIdx = 0;
  state.flashFlipped = false;
  state.screen = "flashcard";
  render();
}

/* words (opsional) = daftar kata untuk "latih yang salah" */
function startKotobaQuiz(words) {
  const pool = selectedWords();
  const retry = Array.isArray(words) && words.length > 0;
  const src = retry ? words : pool;
  if (!src.length) return;
  const qs = buildKotobaQuestions(src, state.kDir, retry ? 0 : state.kCount, pool.length >= 4 ? pool : VOCAB);
  if (!qs.length) return;
  state.mode = "kotoba-quiz";
  state.kWrong = [];
  state.sessionQuestions = qs;
  state.idx = 0; state.score = 0; state.correctCount = 0; state.answered = false;
  state.streak = 0; state.maxStreak = 0;
  state.screen = "quiz";
  render();
}

/* ================= TIMER (speed mode) ================= */
function startTimerForCurrentQuestion() {
  clearTimer();
  state.timeLeft = TIME_LIMIT;
  updateTimerUI();
  state.timerId = setInterval(() => {
    state.timeLeft = Math.max(0, state.timeLeft - 0.1);
    updateTimerUI();
    if (state.timeLeft <= 0) {
      clearTimer();
      if (!state.answered) onAnswer(null); // timeout = salah
    }
  }, 100);
}
function updateTimerUI() {
  const ring = document.getElementById("timerFg");
  const label = document.getElementById("timerNum");
  const wrap = document.getElementById("timerRingWrap");
  if (!ring || !label) return;
  const circumference = 2 * Math.PI * 18;
  const frac = state.timeLeft / TIME_LIMIT;
  ring.style.strokeDashoffset = String(circumference * (1 - frac));
  label.textContent = Math.ceil(state.timeLeft);
  if (wrap) wrap.classList.toggle("low", state.timeLeft <= 4);
}

/* ================= QUIZ FLOW ================= */
function currentQuestion() { return state.sessionQuestions[state.idx]; }

function onAnswer(chosen) {
  if (state.answered) return;
  state.answered = true;
  clearTimer();
  const q = currentQuestion();
  const isCorrect = chosen === q.correct;

  if (isCorrect) {
    state.correctCount++;
    state.streak++;
    state.maxStreak = Math.max(state.maxStreak, state.streak);
    if (state.mode === "speed") {
      const bonus = Math.floor(100 * (state.timeLeft / TIME_LIMIT));
      state.score += 100 + bonus;
    } else {
      state.score++;
    }
  } else {
    state.streak = 0;
    if (q.src && !state.kWrong.includes(q.src)) state.kWrong.push(q.src);
  }

  document.querySelectorAll(".opt").forEach(btn => {
    const val = decodeURIComponent(btn.dataset.opt);
    btn.classList.add("disabled");
    if (val === q.correct) btn.classList.add("correct");
    else if (val === chosen) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });

  const fb = document.getElementById("feedback");
  const stamp = document.getElementById("stamp");
  if (fb) {
    if (isCorrect) {
      fb.textContent = "Benar! 正解 (seikai)";
      fb.className = "feedback show-correct";
    } else if (chosen === null) {
      fb.textContent = `Waktu habis — jawaban benar: ${q.correct}`;
      fb.className = "feedback show-wrong";
    } else {
      fb.textContent = `Kurang tepat — jawaban benar: ${q.correct}`;
      fb.className = "feedback show-wrong";
    }
  }
  if (fb && q.src) {
    fb.innerHTML = escHTML(fb.textContent) + `<div class="wordinfo forceruby">${rubyHTML(q.src)} = ${escHTML(q.src.a)}</div>`;
  }
  if (stamp) {
    if (isCorrect) { stamp.textContent = "正"; stamp.classList.add("pop"); }
    else { stamp.textContent = "✕"; stamp.classList.add("pop", "wrongstamp"); }
  }

  if (state.mode === "speed") {
    updateStreakUI();
    setTimeout(onNext, 750); // auto-advance, ritme cepat
  } else {
    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn) nextBtn.disabled = false;
  }
}

function updateStreakUI() {
  const el = document.getElementById("streakLabel");
  if (el) el.textContent = state.streak > 1 ? `Combo ×${state.streak}` : "";
}

function onNext() {
  state.idx++;
  state.answered = false;
  if (state.idx >= state.sessionQuestions.length) { renderResultScreen(); return; }
  render();
  if (state.mode === "speed") startTimerForCurrentQuestion();
}

/* ================= RESULT ================= */
function renderResultScreen() {
  clearTimer();
  awardQuiz(state.mode === "kotoba-quiz" ? "kotoba" : state.mode === "kbook-quiz" ? "kbook" : "speed", state.correctCount, state.sessionQuestions.length);
  if (state.mode === "kotoba-quiz") { state.screen = "kotoba-result"; render(); return; }
  if (state.mode === "kbook-quiz") { state.screen = "kbook-result"; render(); return; }
  state.screen = "result";
  if (state.mode === "level") {
    const total = state.sessionQuestions.length;
    const pct = state.correctCount / total;
    const prog = state.progress[state.level];
    prog.best = Math.max(prog.best, pct);
    if (pct >= PASS_SCORE) prog.passed = true;
  }
  render();
}

function gradeFor(pct) {
  if (pct >= 0.9) return { letter: "S", msg: "Sugoi! Nyaris sempurna." };
  if (pct >= 0.75) return { letter: "A", msg: "Mantap, udah jago." };
  if (pct >= 0.6) return { letter: "B", msg: "Lumayan, dikit lagi lancar." };
  if (pct >= 0.4) return { letter: "C", msg: "Masih perlu latihan lagi." };
  return { letter: "D", msg: "Coba pelajari kartu belajarnya dulu, ya." };
}

/* ================= FLASHCARD FLOW ================= */
function flashFlip() {
  state.flashFlipped = !state.flashFlipped;
  render();
}
function flashNext() {
  if (state.flashIdx < state.flashDeck.length - 1) { state.flashIdx++; state.flashFlipped = false; render(); }
}
function flashPrev() {
  if (state.flashIdx > 0) { state.flashIdx--; state.flashFlipped = false; render(); }
}

/* ================= RENDER ================= */
function render() {
  applyTheme();
  applyFuri();
  const app = document.getElementById("app");
  applyCosmetics();
  app.innerHTML = topbarHTML() + screenHTML() + bottomNavHTML();
  app.classList.toggle("hasnav", ["main-menu", "shop", "inventory"].includes(state.screen));
  document.body.classList.toggle("focus", ["quiz", "sim-test"].includes(state.screen));
  attachHandlers();
  window.scrollTo(0, 0);
}

const SECTION_META = {
  "kanji":  { label: "Kanji",  mark: "漢" },
  "kotoba": { label: "Kotoba", mark: "言" },
  "bunpo":  { label: "Bunpo",  mark: "文" },
  "dokkai": { label: "Dokkai", mark: "読" },
};
function currentSectionKey() {
  if (state.screen === "main-menu") return null;
  if (["flashcard","quiz","result"].includes(state.screen)) {
    return (state.mode && state.mode.startsWith("kotoba")) ? "kotoba" : "kanji";
  }
  if (["kanji-home","flash-pick","level-pick","speed-pick"].includes(state.screen) || state.screen.startsWith("kbook") || state.screen.startsWith("sim")) return "kanji";
  if (state.screen.startsWith("kotoba")) return "kotoba";
  if (state.screen.startsWith("bunpo")) return "bunpo";
  if (state.screen.startsWith("dokkai")) return "dokkai";
  return null;
}

function topbarHTML() {
  const themeBtn = `<button class="themebtn" id="btnTheme" title="Ganti tema terang/gelap">${state.theme === "dark" ? "&#9728;" : "&#9789;"}</button>`;
  const sec = currentSectionKey();
  const top = ["main-menu", "shop", "inventory"].includes(state.screen);
  const label = state.screen === "main-menu" ? "Beranda" : state.screen === "shop" ? "Toko" : state.screen === "inventory" ? "Koleksi" : (sec ? SECTION_META[sec].label : "Belajar");
  const busy = ["quiz", "sim-test"].includes(state.screen);
  const coin = `<button class="coinpill ${busy ? "static" : ""}" id="btnCoins" title="Koin"><span class="coin"></span><span>${fmtNum(SAVE.coins)}</span></button>`;
  return `
    <div class="topbar">
      <div class="tb-left">
        ${top ? "" : `<button class="iconbtn" id="btnBack" title="Kembali" aria-label="Kembali">&larr;</button>`}
        <div class="brand"><span class="jp">日本語 STUDY</span>${label}</div>
      </div>
      <div class="topbar-actions">
        ${coin}${themeBtn}
        ${top ? "" : `<button class="iconbtn" id="btnMainMenu" title="Menu utama" aria-label="Menu utama">&#8962;</button>`}
      </div>
    </div>`;
}

const BOTTOM_BACK_SCREENS = ["flash-pick", "level-pick", "speed-pick", "kotoba-home", "kotoba-setup", "kbook-setup", "sim-home"];
function screenHTML() {
  let html = "";
  switch (state.screen) {
    case "main-menu": html = mainMenuHTML(); break;
    case "shop": html = shopHTML(); break;
    case "inventory": html = inventoryHTML(); break;
    case "kanji-home": html = kanjiHomeHTML(); break;
    case "flash-pick": html = flashPickHTML(); break;
    case "flashcard": html = flashcardHTML(); break;
    case "level-pick": html = levelPickHTML(); break;
    case "speed-pick": html = speedPickHTML(); break;
    case "quiz": html = quizHTML(); break;
    case "result": html = resultHTML(); break;
    case "kotoba-home": html = kotobaHomeHTML(); break;
    case "kotoba-setup": html = kotobaSetupHTML(); break;
    case "kotoba-result": html = kotobaResultHTML(); break;
    case "kbook-setup": html = kbookSetupHTML(); break;
    case "kbook-result": html = kbookResultHTML(); break;
    case "sim-home": html = simHomeHTML(); break;
    case "sim-test": html = simTestHTML(); break;
    case "sim-result": html = simResultHTML(); break;
    case "bunpo-home": html = placeholderHTML("bunpo"); break;
    case "dokkai-home": html = placeholderHTML("dokkai"); break;
  }
  if (BOTTOM_BACK_SCREENS.includes(state.screen)) {
    html += `<button class="ghost" id="btnBackBottom">&larr; Kembali</button>`;
  }
  return html;
}

/* ---------- MAIN MENU (top level) ---------- */
/* ---------- COMING SOON PLACEHOLDER ---------- */
function placeholderHTML(section) {
  const meta = SECTION_META[section];
  const copy = {
    bunpo: "Latihan pola kalimat dan tata bahasa dari Minna no Nihongo — partikel, konjugasi, struktur kalimat.",
    dokkai: "Latihan membaca teks pendek lalu jawab pertanyaan pemahamannya.",
  }[section];
  return `
    <div class="comingsoon">
      <div class="mark">${meta.mark}</div>
      <h2>${meta.label} segera hadir</h2>
      <p>${copy}</p>
      <button class="ghost" id="btnBackMain" style="margin-top:6px;">Kembali ke Menu Utama</button>
    </div>
  `;
}

/* ---------- KOTOBA HOME (pilih buku) ---------- */
function kotobaHomeHTML() {
  const books = [
    { key:"MNN1", title:"Minna no Nihongo I", desc:`Pelajaran 1–25 · ${VOCAB.filter(w => w.b === 1).length} kata. Pilih satu atau beberapa pelajaran sekaligus.`, ready:true },
    { key:"MNN2", title:"Minna no Nihongo II", desc:`Pelajaran 26–50 · ${VOCAB2.length} kata. Pilih satu atau beberapa pelajaran sekaligus.`, ready:true },
    { key:"Irodori", title:"Irodori 入門", desc:`Pelajaran 1–18 · ${VOCAB3.length} kata (Daftar Kosakata resmi Japan Foundation, versi B. Indonesia).`, ready:true },
    { key:"Irodori1", title:"Irodori 初級1", desc:`Pelajaran 1–18 · ${VOCAB4.length} kata (Daftar Kosakata resmi Japan Foundation, versi B. Indonesia).`, ready:true },
    { key:"Irodori2", title:"Irodori 初級2", desc:`Pelajaran 1–18 · ${VOCAB5.length} kata (Daftar Kosakata resmi Japan Foundation, versi B. Indonesia).`, ready:true },
  ];

/* ---------- KOTOBA SETUP (satu layar: mode, pelajaran, arah, furigana) ---------- */
function kotobaSetupHTML() {
  const sel = new Set(state.kSel);
  const words = selectedWords();
  const isQuiz = state.kMode === "quiz";
  const eligible = isQuiz && state.kDir === "kana" ? words.filter(w => w.hasK).length : words.length;
  const nQ = state.kCount > 0 ? Math.min(state.kCount, eligible) : eligible;
  const seg = (attr, cur, items) => `<div class="seg">${items.map(([v, l]) =>
    `<button class="segbtn ${String(cur) === String(v) ? "on" : ""}" data-${attr}="${v}">${l}</button>`).join("")}</div>`;
  const chips = KOTOBA_LESSONS.map(n =>
    `<button class="chip ${sel.has(n) ? "on" : ""}" data-klesson="${n}" aria-pressed="${sel.has(n)}">${n}</button>`).join("");
  const lessonOpts = (cur) => KOTOBA_LESSONS.map(n => `<option value="${n}" ${n === cur ? "selected" : ""}>${n}</option>`).join("");

  const dirs = [
    ["kana", "読", "Kanji → Baca", "Lihat kanji, pilih cara bacanya (hanya kata yang punya kanji)"],
    ["arti", "訳", "Jepang → Arti", "Lihat kata Jepang, pilih artinya"],
    ["jp", "日", "Arti → Jepang", "Lihat artinya, pilih kata Jepangnya"],
    ["mix", "混", "Campur", "Ketiga arah diacak"],
  ];
  const dirRows = dirs.map(([k, ic, t, d]) => `
    <button class="levelrow ${state.kDir === k ? "on" : ""}" data-kdir="${k}">
      <div class="num">${ic}</div><div><h4>${t}</h4><p>${d}</p></div>
    </button>`).join("");

  const modeSection = isQuiz ? `
    <div class="setupsec">
      <div class="setuplabel">3 · Arah soal</div>
      ${dirRows}
    </div>
    <div class="setupsec">
      <div class="setuplabel">4 · Jumlah soal</div>
      ${seg("kcount", state.kCount, [[10, "10"], [20, "20"], [30, "30"], [0, "Semua"]])}
    </div>` : `
    <div class="setupsec">
      <div class="setuplabel">3 · Sisi depan kartu</div>
      ${seg("kfront", state.kFront, [["jp", "Jepang dulu"], ["id", "Arti dulu"]])}
      <label class="switchrow" style="margin-top:10px;">
        <span>Acak urutan kartu<small>Matikan untuk urut sesuai buku</small></span>
        <input type="checkbox" id="kShuffleSw" ${state.kShuffle ? "checked" : ""}>
      </label>
    </div>`;

  const count = isQuiz ? nQ : words.length;
  const startLabel = isQuiz ? `Mulai Kuis (${nQ} soal)` : `Mulai Flashcard (${words.length} kartu)`;
  const note = isQuiz && state.kDir === "kana" && eligible < words.length
    ? `<div class="selsum">${words.length - eligible} kata tanpa kanji dilewati pada arah ini.</div>` : "";

  return `
    <div class="eyebrow">Kotoba — ${state.kBook === "Irodori" ? "Irodori 入門" : state.kBook === "Irodori1" ? "Irodori 初級1" : state.kBook === "Irodori2" ? "Irodori 初級2" : "Minna no Nihongo " + (state.kBook === "MNN2" ? "II" : "I")}</div>
    <h2 style="margin-bottom:4px;">Atur Latihan</h2>
    <div class="sub">Semua pilihan ada di satu layar. Setelah selesai, tombol Kembali membawamu ke sini lagi.</div>

    <div class="setupsec">
      <div class="setuplabel">1 · Mau latihan apa?</div>
      ${seg("kmode", state.kMode, [["flash", "Flashcard"], ["quiz", "Kuis"]])}
    </div>

    <div class="setupsec">
      <div class="setuplabel">2 · Pilih pelajaran</div>
      <div class="quickrow">
        <button class="pill" id="kAll">Semua</button>
        <button class="pill" id="kNone">Kosongkan</button>
      </div>
      <div class="chips">${chips}</div>
      <div class="rangerow">
        <span>Rentang: bab</span>
        <select id="kFrom">${lessonOpts(state.kFrom)}</select>
        <span>sampai</span>
        <select id="kTo">${lessonOpts(state.kTo)}</select>
        <button class="pill" id="kRange">Pilih</button>
      </div>
      <div class="selsum"><strong>Pelajaran ${lessonsLabel(state.kSel)}</strong> · ${words.length} kata</div>
    </div>

    ${modeSection}

    <div class="setupsec">
      <div class="setuplabel">${isQuiz ? "5" : "4"} · Furigana</div>
      <label class="switchrow">
        <span>Tampilkan furigana<small>Cara baca di atas kanji. Pada arah Kanji → Baca, furigana soal selalu disembunyikan.</small></span>
        <input type="checkbox" id="kFuriSw" ${state.kFuri ? "checked" : ""}>
      </label>
    </div>
    ${note}

  `;

/* ---------- LEVEL PICK ---------- */
function levelPickHTML() {
  const rows = LEVELS.map((lv, i) => {

      <div class="levelrow locked">
        <div class="num">${lv.num}</div>

  return `

    <h2 style="margin-bottom:8px;">Pilih level</h2>
    <div class="sub">${QUIZ_SIZE_LEVEL} soal acak per ronde. Lulus minimal 70% untuk naik level.</div>
    ${rows}
  `;
}

/* ---------- SPEED PICK ---------- */
function speedWords(pool) {
  const books = pool === "allbooks" ? [1, 2, 3, 4, 5] : [BOOK_NUM[pool]];
  const NAMEISH = /\(\d{4}|fiksi|ilmuwan|penulis|tokoh|novelis|pelukis|^nama |danau|kuil .*\(|^gunung [A-Z]|\(Jepang\)|\(Jerman\)/i;
  return VOCAB.filter(w => books.includes(w.b) && w.hasK && !w.u && !/[0-9０-９。？！]/.test(w.jp) && w.jp.length <= 8 &&
    !NAMEISH.test(w.a) && kanjiOf(w.jp).length && kanjiOf(w.jp).every(c => lvOk(c, state.spLv)));
}
function speedPickHTML() {
  const lvSeg = `<div class="seg" style="margin-bottom:14px;">${[["all", "Semua level"], ["5", "N5 saja"], ["54", "N5 + N4"]].map(([v, l]) =>
    `<button class="segbtn ${state.spLv === v ? "on" : ""}" data-splv="${v}">${l}</button>`).join("")}</div>`;
  const opts = [["allbooks", "∀", "Semua Buku — Campuran"], ...KJ_BOOKS.map(([k, short]) => [k, short.replace("MNN ", ""), KJ_BOOK_NAME[k]])];
  const rows = opts.map(([key, ic, name]) => {
    const n = speedWords(key).length;
    return `<button class="levelrow" data-speed="${key}" ${n < 4 ? "disabled" : ""}>
      <div class="num">${ic}</div>
      <div><h4>${name}</h4><p>${n} kata berkanji &middot; ${QUIZ_SIZE_SPEED} soal &middot; ${TIME_LIMIT} detik per soal</p></div>
    </button>`;
  }).join("");
  return `
    <div class="eyebrow">Mode Kecepatan</div>
    <h2 style="margin-bottom:8px;">Pilih sumber kanji</h2>
    <div class="sub">Soal acak 読み (cara baca), 表記 (penulisan kanji), dan arti. Semakin cepat benar, semakin besar skornya.</div>
    ${lvSeg}
    ${rows}
  `;
}

/* ---------- QUIZ (shared: level, speed, kotoba) ---------- */
function quizHTML() {
  if (state.mode === "kotoba-quiz") return kotobaQuizHTML();
  if (state.mode === "kbook-quiz") return kbookQuizHTML();
  const q = currentQuestion();
  const total = state.sessionQuestions.length;
  const pct = Math.round((state.idx) / total * 100);
  const modeLabel = state.mode === "speed" ? "Mode Kecepatan"
    : state.mode === "kotoba-quiz" ? `Kotoba — Pelajaran ${lessonsLabel(state.kSel)}`
    : `Kuis Bertahap — Level ${state.level}`;

  const questionBlock = q.type === "kbook"
    ? `${q.promptHTML}<div class="q-hint">${q.hint}</div>`
    : q.type === "reading"
    ? `<div class="kanji-big">${q.prompt}</div><div class="q-hint">Pilih bacaan (hiragana) yang tepat</div>`
    : q.type === "meaning"
    ? `<div class="kanji-big">${q.prompt}</div><div class="q-hint">Pilih arti yang tepat</div>`
    : `<div class="q-desc">${q.prompt}</div><div class="q-hint">${q.type === "odd" ? "Pilih kata yang tidak sekategori" : "Pilih kata/kanji yang sesuai"}</div>`;

  const timerBlock = state.mode === "speed" ? `
    <div class="timerwrap">
      <div class="timerring" id="timerRingWrap">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle class="bg" cx="20" cy="20" r="18"></circle>
          <circle class="fg" id="timerFg" cx="20" cy="20" r="18"
            stroke-dasharray="${2 * Math.PI * 18}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="num" id="timerNum">${TIME_LIMIT}</div>
      </div>
      <div class="streak" id="streakLabel">${state.streak > 1 ? `Combo ×${state.streak}` : ""}</div>
    </div>` : "";

  const showNextBtn = state.mode === "level" || state.mode === "kotoba-quiz";

  return `
    <div class="eyebrow">${modeLabel}</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill ${state.mode === "speed" ? "speed" : ""}" style="width:${pct}%"></div></div>
      <div class="progress-label">問 ${state.idx + 1} / ${total}</div>
    </div>
    ${timerBlock}
    <div class="qcard">
      <div class="stamp" id="stamp"></div>
      <div class="section-tag">${q.topic}</div>
      ${questionBlock}
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="opt" data-opt="${encodeURIComponent(opt)}">
            <span class="letter">${String.fromCharCode(65 + i)}</span>
            <span>${q.optHTML ? q.optHTML[opt] : opt}</span>
          </button>`).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      ${showNextBtn ? `
      <div class="nextbar">
        <button class="primary" id="nextBtn" disabled>Lanjut</button>
      </div>` : ``}
    </div>
  `;
}

/* ---------- RESULT ---------- */
function resultHTML() {
  const total = state.sessionQuestions.length;
  const correct = state.correctCount;
  const pct = Math.round((correct / total) * 100);

  if (state.mode === "level") {
    const passed = (correct / total) >= PASS_SCORE;
    const next = nextLevelNum();
    const isLastLevel = state.level === LEVELS[LEVELS.length - 1].num;
    return `
      <div class="eyebrow">Hasil — Kuis Bertahap Level ${state.level}</div>
      <div class="result">
        <span class="passbadge ${passed ? "pass" : "retry"}">${passed ? "LULUS" : "BELUM LULUS"}</span>
        <div class="bigstamp"><div class="score-num">${correct}</div><div class="score-den">/ ${total}</div></div>
        <h2>${pct}% Benar</h2>
        <p>${passed
          ? (isLastLevel ? "Semua level Kuis Bertahap sudah kamu selesaikan!" : "Level berikutnya sudah terbuka.")
          : `Perlu minimal ${Math.round(PASS_SCORE * 100)}% untuk lulus. Coba lagi, yuk.`}</p>
        ${passed && !isLastLevel ? `<button class="primary" id="toNextLevel">Lanjut ke Level ${next}</button>` : ``}
        <button class="ghost" id="retryLevel">Ulangi Level Ini</button>
        <button class="ghost" id="homeBtn">Kembali ke Menu</button>
      </div>
      <div class="footer-note">Progres level ini hanya tersimpan selama halaman terbuka.</div>
    `;
  }

  // speed mode
  const grade = gradeFor(correct / total);
  return `
    <div class="eyebrow">Hasil — Mode Kecepatan</div>
    <div class="result">
      <div class="bigstamp amber"><div class="score-num">${grade.letter}</div><div class="score-den">grade</div></div>
      <h2>${state.score} poin</h2>
      <p>${correct}/${total} benar (${pct}%) &middot; combo tertinggi ×${state.maxStreak}<br>${grade.msg}</p>
      ${rewardHTML()}
      <button class="primary amber" id="retrySpeed">Main Lagi</button>

function kanjiOf(str) { return [...String(str)].filter(c => KJDB[c]); }
function lvOk(c, f) { const lv = KJDB[c][2]; return f === "all" || (f === "5" ? lv === 5 : lv === 5 || lv === 4); }
function jSetBook(key) {
  state.jBook = key;
  const b = BOOK_NUM[key] || 1;
  state.jLessons = [...new Set(VOCAB.filter(w => w.b === b).map(w => w.l))].sort((x, y) => x - y);
  state.jSel = state.jSel.filter(n => state.jLessons.includes(n));
  if (!state.jSel.length) state.jSel = [state.jLessons[0]];
  state.jFrom = state.jLessons[0]; state.jTo = state.jLessons[Math.min(7, state.jLessons.length - 1)];
}
function jWords() {
  const s = new Set(state.jSel), b = BOOK_NUM[state.jBook] || 1;
  return VOCAB.filter(w => w.b === b && s.has(w.l) && w.hasK && kanjiOf(w.jp).length && kanjiOf(w.jp).every(c => lvOk(c, state.jLv)));
}
function jKanjiList(words) {
  const seen = new Set(), out = [];
  words.forEach(w => kanjiOf(w.jp).forEach(c => { if (!seen.has(c) && lvOk(c, state.jLv)) { seen.add(c); out.push(c); } }));
  return out;
}
const JPREF_KEY = "kanjiBookPrefs.v1";

/* ---------- pengecoh ---------- */
const VOICE = {};
"かきくけこさしすせそたちつてとはひふへほ".split("").forEach((c, i) => { const d = "がぎぐげござじずぜぞだぢづでどばびぶべぼ"[i]; if (!"ぢづ".includes(d)) { VOICE[c] = d; VOICE[d] = c; } });
const O_ROW = "おこそとのほもよろごぞどぼぽょ", KST = "かきくけこさしすせそたちつてとぱぴぷぺぽ";
function kanaVariants(r) {
  const out = [];
  for (let i = 0; i < r.length; i++) {
    const c = r[i];
    if (VOICE[c]) out.push(r.slice(0, i) + VOICE[c] + r.slice(i + 1));
    if (c === "う" && i > 0 && (O_ROW.includes(r[i - 1]) || r[i - 1] === "ゅ")) out.push(r.slice(0, i) + r.slice(i + 1));
    if (c === "っ") out.push(r.slice(0, i) + r.slice(i + 1));
    if ("ゅょゃ".includes(c)) "ゅょゃ".split("").filter(d => d !== c).forEach(d => out.push(r.slice(0, i) + d + r.slice(i + 1)));
    if (i > 0 && KST.includes(c) && !"っんー".includes(r[i - 1])) out.push(r.slice(0, i) + "っ" + r.slice(i));
    if (i > 0 && (O_ROW.includes(r[i - 1]) || r[i - 1] === "ゅ") && !"うおーっ".includes(c)) out.push(r.slice(0, i) + "う" + r.slice(i));
  }
  return [...new Set(out)].filter(v => v !== r);
}
function headPart(s) { const i = s.search(/[ 　\[［(（]/); return i > 0 ? [s.slice(0, i), s.slice(i)] : [s, ""]; }
function yomiOptions(w, pool) {
  const [head, tail] = headPart(w.k);
  const seen = new Set([w.k]), out = [];
  shuffle(kanaVariants(head)).slice(0, 2).forEach(v => { const s = v + tail; if (!seen.has(s)) { seen.add(s); out.push(s); } });
  const others = shuffle(pool.filter(x => x.id !== w.id && x.hasK && /^[ぁ-ゖー]+$/.test(x.k))).sort((a, b) =>
    Math.abs(headPart(a.k)[0].length - head.length) - Math.abs(headPart(b.k)[0].length - head.length));
  for (const x of others) { if (out.length >= 3) break; if (!seen.has(x.k)) { seen.add(x.k); out.push(x.k); } }
  return out.slice(0, 3);
}
function hyoukiOptions(w, pool) {
  const jp = w.jp, seen = new Set([jp]), out = [];
  const pos = [...jp].map((c, i) => [c, i]).filter(([c]) => KJSIM[c]);
  const cand = [];
  pos.forEach(([c, i]) => [...KJSIM[c]].forEach(s => { const a = [...jp]; a[i] = s; cand.push([i, a.join("")]); }));
  if (pos.length >= 2) {
    const [[c1, i1], [c2, i2]] = shuffle(pos).slice(0, 2);
    const a = [...jp]; a[i1] = KJSIM[c1][0]; a[i2] = KJSIM[c2][0]; cand.push([-1, a.join("")]);
  }
  const usedPos = new Set();
  for (const pass of [true, false]) for (const [i, s] of shuffle(cand)) {
    if (out.length >= 3) break;
    if (seen.has(s) || VOCAB_JP_SET.has(s) || (pass && usedPos.has(i))) continue;
    seen.add(s); usedPos.add(i); out.push(s);
  }
  for (const x of shuffle(pool)) { if (out.length >= 3) break; if (x.hasK && !seen.has(x.jp) && x.jp.length === jp.length) { seen.add(x.jp); out.push(x.jp); } }
  for (const x of shuffle(VOCAB)) { if (out.length >= 3) break; if (x.hasK && !seen.has(x.jp)) { seen.add(x.jp); out.push(x.jp); } }
  return out;
}
function buildKBookQuestions(words, dir, count) {
  let list = shuffle(words);
  if (count > 0) list = list.slice(0, count);
  const pool = words.length >= 4 ? words : VOCAB.filter(w => w.hasK);
  return list.map(w => {
    const d = dir === "mix" ? ["yomi", "hyouki", "arti"][Math.floor(Math.random() * 3)] : dir;
    const sz = sizeClass(w.jp.length);
    let correct, opts, optHTML = {}, promptHTML;
    if (d === "yomi") {
      correct = w.k; opts = [w.k, ...yomiOptions(w, pool)];
      opts.forEach(o => optHTML[o] = escHTML(o));
      promptHTML = `<div class="kanji-big noruby ${sz}">${escHTML(w.jp)}</div>`;
    } else if (d === "hyouki") {
      correct = w.jp; opts = [w.jp, ...hyoukiOptions(w, pool)];
      opts.forEach(o => optHTML[o] = `<span class="kjopt">${escHTML(o)}</span>`);
      promptHTML = `<div class="kanji-big ${sizeClass(w.k.length)}">${escHTML(w.k)}</div><div class="q-desc q-meaning" style="font-size:14px;margin-top:-4px;">${escHTML(w.a)}</div>`;
    } else {
      correct = w.a; opts = [w.a, ...pickDistractors(w, "arti", pool).map(x => x.a)];
      opts.forEach(o => optHTML[o] = escHTML(o));
      promptHTML = `<div class="kanji-big ${sz}">${rubyHTML(w)}</div>`;
    }
    return { type: "kbook", dir: d, src: w, topic: `${KJ_BOOK_NAME[state.jBook]} · Pel. ${w.l}`,
      promptHTML, hint: KJ_DIR[d].hint, correct, options: shuffle(opts), optHTML };
  });
}

const SIM_TIME = 600; // detik per paket (12 soal)
const SIM_BEST_KEY = "kanjiSimBest.v1";
function simBest() { try { return JSON.parse(localStorage.getItem(SIM_BEST_KEY) || "{}"); } catch (e) { return {}; } }
function simSaveBest(lv, idx, score) {
  try { const b = simBest(); b[lv] = b[lv] || {}; b[lv][idx] = Math.max(b[lv][idx] || 0, score); localStorage.setItem(SIM_BEST_KEY, JSON.stringify(b)); } catch (e) {}
}
function goSimHome() { clearTimer(); state.screen = "sim-home"; render(); }
function startSim(idx) {
  clearTimer();
  const set = SIM_SETS[state.simLv][idx];
  state.simIdx = idx; state.simAns = {};
  state.simQs = [...set.r.map(q => ({ part: 1, s: q[0], ans: q[1], m: q[3], opts: shuffle([q[1], ...q[2]]) })),
                 ...set.h.map(q => ({ part: 2, s: q[0], ans: q[1], m: q[3], opts: shuffle([q[1], ...q[2]]) }))];
  state.simLeft = SIM_TIME;
  state.screen = "sim-test"; render();
  state.timerId = setInterval(() => {
    state.simLeft--;
    const el = document.getElementById("simClock");
    if (el) { el.textContent = fmtClock(state.simLeft); el.classList.toggle("low", state.simLeft <= 60); }
    if (state.simLeft <= 0) finishSim();
  }, 1000);
}
function fmtClock(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function finishSim() {
  clearTimer();
  const score = state.simQs.filter((q, i) => state.simAns[i] === q.ans).length;
  state.simScore = score;
  awardQuiz("sim", score, state.simQs.length);
  simSaveBest(state.simLv, state.simIdx, score);
  state.screen = "sim-result"; render();
}
function simSentenceHTML(s) {
  return escHTML(s).replace(/\[(.+?)\]/, '<span class="simu">$1</span>');
}
function simHomeHTML() {
  const best = simBest()[state.simLv] || {};

    return `<button class="levelrow" data-simset="${i}"><div class="num">${i + 1}</div><div style="flex:1"><h4>Paket ${i + 1}</h4><p>問題1 漢字読み 7 soal · 問題2 表記 5 soal · 10 menit</p></div>${badge}</button>`;
  }).join("");
  return `

    <div class="seg" style="margin-bottom:14px;"><button class="segbtn ${state.simLv === "N5" ? "on" : ""}" data-simlv="N5">N5</button><button class="segbtn ${state.simLv === "N4" ? "on" : ""}" data-simlv="N4">N4</button></div>

    <div class="simpart">
