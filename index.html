}
function simResultHTML() {
  const qs = state.simQs, score = state.simScore, pct = Math.round(score / qs.length * 100);
  const grade = gradeFor(score / qs.length);
  const p1 = qs.filter((q, i) => q.part === 1 && state.simAns[i] === q.ans).length, n1 = qs.filter(q => q.part === 1).length;
  const rev = qs.map((q, i) => {
    const mine = state.simAns[i], ok = mine === q.ans;
    return `<div class="simrev ${ok ? "ok" : "ng"}">
      <div class="simsent"><span class="simno">${i + 1}</span>${simSentenceHTML(q.s)}</div>
      <div class="simrevline">${ok ? "✓ Benar" : `✕ Jawabanmu: <b>${mine ? escHTML(mine) : "(kosong)"}</b>`} · Kunci: <b>${escHTML(q.ans)}</b></div>
      <div class="simrevmean">${escHTML(q.m)}</div></div>`;
  }).join("");
  const hasNext = state.simIdx < SIM_SETS[state.simLv].length - 1;
  return `
    <div class="eyebrow">Hasil — JLPT ${state.simLv} · Paket ${state.simIdx + 1}</div>
    <div class="result">
      <div class="bigstamp ${score >= 9 ? "" : "amber"}"><div class="score-num">${score}</div><div class="score-den">/ ${qs.length}</div></div>
      <h2>${pct}% Benar</h2>
      <p>問題1 漢字読み ${p1}/${n1} · 問題2 表記 ${score - p1}/${qs.length - n1}<br>${grade.msg}</p>
      ${rewardHTML()}
      ${hasNext ? `<button class="primary" id="simNext">Paket ${state.simIdx + 2} &rarr;</button>` : ""}
      <button class="primary amber" id="simRetry" style="margin-top:10px;">Ulangi Paket Ini</button>
      <button class="ghost" id="simList">&larr; Daftar Paket</button>
    </div>
    <h3 style="margin:22px 0 10px;">Pembahasan</h3>
    ${rev}`;
}

function sanitizeSave(p) {
  const s = freshSave();

  ["coins", "earned", "quizzes", "pulls", "streak"].forEach(k => { if (Number.isFinite(p[k]) && p[k] >= 0) s[k] = Math.floor(p[k]); });
  if (typeof p.lastDay === "string") s.lastDay = p.lastDay;
  if (p.theme === "dark" || p.theme === "light") s.theme = p.theme;
  CHEST_KEYS.forEach(k => {

    if (p.owned && Array.isArray(p.owned[k])) s.owned[k] = [...new Set(p.owned[k].filter(id => ids.has(id)))];
    if (p.eq && s.owned[k].includes(p.eq[k])) s.eq[k] = p.eq[k];

const COIN_PER = { kotoba: 2, kbook: 2, speed: 3, sim: 5 };
function awardQuiz(kind, correct, total) {
  const per = COIN_PER[kind] || 2, base = correct * per, pct = total ? correct / total : 0;
  let bonus = 0, bonusLabel = "";
  if (kind === "sim") {
    if (correct === total) { bonus = 40; bonusLabel = "Nilai sempurna"; }
    else if (correct >= 9) { bonus = 20; bonusLabel = "Lulus simulasi (≥ 9/12)"; }
  } else if (total >= 10) {
    if (pct === 1) { bonus = 25; bonusLabel = "Nilai sempurna"; }
    else if (pct >= 0.8) { bonus = 10; bonusLabel = "Nilai ≥ 80%"; }
  }
  let daily = 0;
  const today = dayKey();
  if (total >= 5 && correct > 0 && SAVE.lastDay !== today) {
    SAVE.streak = SAVE.lastDay === dayKey(-1) ? SAVE.streak + 1 : 1;
    SAVE.lastDay = today; daily = 20;
  }
  const sum = base + bonus + daily;
  SAVE.coins += sum; SAVE.earned += sum; SAVE.quizzes++;
  saveSave();
  state.lastReward = { per, correct, base, bonus, bonusLabel, daily, sum };
}

  const r = state.lastReward;
  if (!r) return "";
  return `<div class="reward">

}

function hexRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function rgbHex(a) { return "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join(""); }
function mixHex(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return rgbHex(x.map((v, i) => v + (y[i] - v) * t)); }
function lumOf(h) { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function contrastOf(a, b) { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function ensureContrast(c, bg, min) {
  const target = lumOf(bg) > 0.5 ? "#000000" : "#ffffff";
  let out = c;
  for (let t = 0.06; t <= 1 && contrastOf(out, bg) < min; t += 0.06) out = mixHex(c, target, t);
  return out;
}
function gradCSS(it) { return `linear-gradient(100deg, ${it.c.join(",")})`; }
function swatchCSS(it) {
  if (!it.c) return "conic-gradient(from 210deg, #2F4C6B 0 58%, #C97C2C 58% 82%, #F6F3EC 82%)";
  if (it.c.length > 1) return `radial-gradient(circle at 78% 78%, ${it.s} 0 22%, transparent 23%), ${gradCSS(it)}`;
  return `conic-gradient(from 210deg, ${it.c[0]} 0 58%, ${it.s} 58% 82%, ${(it.L && it.L.bg) || "#F4F2EC"} 82%)`;
}
const PAL_PROPS = ["--indigo", "--indigo-dark", "--accent-bg", "--on-accent", "--amber", "--amber-dark", "--on-amber", "--bg", "--card", "--line"];

/* ---------- terapkan kosmetik ---------- */
let BG_APPLIED = null;
function applyCosmetics() {
  const root = document.documentElement, st = root.style;
  // warna
  const acc = ITEM("warna", SAVE.eq.warna);
  PAL_PROPS.forEach(p => st.removeProperty(p));
  root.classList.toggle("acc-anim", !!acc.anim);
  if (acc.c) {
    const dark = state.theme === "dark", main = acc.c[0];
    const nt = dark ? (acc.D || { bg: mixHex("#16181D", main, 0.06), card: mixHex("#20232A", main, 0.08) })
                    : (acc.L || { bg: mixHex("#F6F5F2", main, 0.05), card: mixHex("#FFFFFF", main, 0.012) });
    const minFill = dark ? 1.6 : 1.12;
    st.setProperty("--bg", nt.bg); st.setProperty("--card", nt.card);
    st.setProperty("--line", dark ? mixHex(nt.card, "#ffffff", 0.13) : mixHex(nt.bg, "#000000", 0.11));
    const fill = ensureContrast(main, nt.card, minFill);
    st.setProperty("--indigo", ensureContrast(main, nt.card, 3.6));
    st.setProperty("--indigo-dark", mixHex(fill, "#000000", 0.18));
    st.setProperty("--accent-bg", acc.c.length > 1 ? gradCSS(acc) : fill);
    st.setProperty("--on-accent", lumOf(acc.c[Math.floor(acc.c.length / 2)]) > 0.45 ? "#201E1B" : "#ffffff");
    if (acc.s) {
      const sf = ensureContrast(acc.s, nt.card, minFill);
      st.setProperty("--amber", sf);
      st.setProperty("--amber-dark", ensureContrast(acc.s, nt.card, 3.6));
      st.setProperty("--on-amber", lumOf(sf) > 0.45 ? "#201E1B" : "#ffffff");
    }
  }
  // tampilan
  const body = document.body;
  [...body.classList].filter(c => c.startsWith("ui-") || c === "uiscope").forEach(c => body.classList.remove(c));
  if (SAVE.eq.tampilan !== "default") body.classList.add("uiscope", "ui-" + SAVE.eq.tampilan);
  // background
  const layer = document.getElementById("bgLayer");
  if (layer && BG_APPLIED !== SAVE.eq.bg) {
    BG_APPLIED = SAVE.eq.bg;
    layer.className = "bg-" + SAVE.eq.bg;
    let extra = "";
    if (SAVE.eq.bg === "sakura") for (let i = 0; i < 10; i++) {
      const s = 8 + Math.random() * 7;
      extra += `<i class="petal" style="left:${(Math.random() * 100).toFixed(1)}%;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;animation-duration:${(14 + Math.random() * 10).toFixed(1)}s;animation-delay:-${(Math.random() * 20).toFixed(1)}s;opacity:${(0.35 + Math.random() * 0.35).toFixed(2)}"></i>`;
    }
    if (SAVE.eq.bg === "kunang") for (let i = 0; i < 11; i++) {
      extra += `<i class="firefly" style="left:${(Math.random() * 92).toFixed(1)}%;top:${(8 + Math.random() * 86).toFixed(1)}%;animation-duration:${(12 + Math.random() * 10).toFixed(1)}s, ${(3 + Math.random() * 3).toFixed(1)}s;animation-delay:-${(Math.random() * 6).toFixed(1)}s, -${(Math.random() * 3).toFixed(1)}s"></i>`;
    }
    layer.innerHTML = extra;
  }
}

function rollChest(key) {
  const ch = CHESTS[key], pity = SAVE.pity[key] || 0;
  let pool = RAR_ORDER.filter(r => ch.items.some(i => i.r === r));

  let t = Math.random() * pool.reduce((a, r) => a + RAR[r].w, 0), rar = pool[pool.length - 1];
  for (const r of pool) { if (t < RAR[r].w) { rar = r; break; } t -= RAR[r].w; }
  SAVE.pity[key] = "rel".includes(rar) ? 0 : pity + 1;
  const cands = ch.items.filter(i => i.r === rar), fresh = cands.filter(i => !isOwned(key, i.id));
  const from = (fresh.length && Math.random() < 0.7) ? fresh : cands;
  const item = from[Math.floor(Math.random() * from.length)];
  const isNew = !isOwned(key, item.id), refund = isNew ? 0 : RAR[rar].refund;
  if (isNew) SAVE.owned[key].push(item.id); else SAVE.coins += refund;
  return { item, isNew, refund };
}

  g.querySelector("#gachaEquip").addEventListener("click", () => { SAVE.eq[key] = it.id; saveSave(); closeGacha(); });
  g.querySelector("#gachaAgain").addEventListener("click", () => buyChest(key));
  g.querySelector("#gachaClose").addEventListener("click", closeGacha);
}

/* ---------- koleksi ---------- */
function setOwned(st) { return isOwned("warna", st.w) && isOwned("tampilan", st.t) && isOwned("bg", st.b); }
function setsHTML() {
  return SETS.map((st, i) => {
    const parts = [["warna", st.w], ["tampilan", st.t], ["bg", st.b]];
    const ok = setOwned(st), on = SAVE.eq.warna === st.w && SAVE.eq.tampilan === st.t && SAVE.eq.bg === st.b;
    return `<div class="shopcard setcard">
      <div class="shop-top">
        <div class="setpv">${parts.map(([c, id]) => previewHTML(c, ITEM(c, id))).join("")}</div>
        <div class="shop-info"><h3>${st.n}</h3><p>${st.d}</p></div>
      </div>
      <div class="setparts">${parts.map(([c, id]) => { const it = ITEM(c, id); return `<span class="oddsitem rar-${it.r} ${isOwned(c, id) ? "own" : ""}">${CAT_LABEL[c]}: ${it.n} ${isOwned(c, id) ? "✓" : "· terkunci"}</span>`; }).join("")}</div>
      <button class="primary" data-set="${i}" ${ok && !on ? "" : "disabled"} style="margin-top:12px;">${on ? "Sedang dipakai" : ok ? "Pakai kombinasi" : "Belum lengkap"}</button>
    </div>`;
  }).join("");
}
function inventoryHTML() {
  const tab = state.invTab, isSet = tab === "set", ch = CHESTS[tab];
  const tabs = CHEST_KEYS.map(k => `<button class="segbtn ${k === tab ? "on" : ""}" data-invtab="${k}">${CAT_LABEL[k]}<small>${ownedIn(k)}/${CHESTS[k].items.length}</small></button>`).join("");
  const cell = (it) => {
    const own = isOwned(tab, it.id), on = SAVE.eq[tab] === it.id;
    return `<button class="invitem rar-${it.r} ${own ? "" : "locked"} ${on ? "on" : ""}" ${own ? `data-equip="${it.id}"` : "disabled"}>
      ${on ? `<span class="badge">Dipakai</span>` : ""}
      ${previewHTML(tab, it)}
      <span class="nm">${it.n}</span>
      <small>${it.r === "d" ? "Bawaan" : RAR[it.r].name}${own ? "" : " · terkunci"}</small>
    </button>`;
  };
  return `
    <div class="eyebrow">Koleksi</div>
    <h2 style="margin-bottom:4px;">Inventori</h2>
    <div class="sub">Ketuk item yang sudah dimiliki untuk memasangnya. Item terkunci didapat dari chest di Toko.</div>
    <div class="invtabs">${tabs}</div>
    <button class="segbtn setbtn ${isSet ? "on" : ""}" data-invtab="set">Kombinasi siap pakai<small>${SETS.filter(setOwned).length}/${SETS.length} lengkap</small></button>
    ${isSet ? setsHTML() : `<div class="invgrid">${cell(ch.def)}${ch.items.map(cell).join("")}</div>`}
    <details class="infobox"><summary>Cadangkan / pulihkan progres</summary>
      <p>Progres hanya tersimpan di perangkat ini. Salin kode di bawah untuk pindah ke perangkat lain atau sebagai cadangan.</p>
      <textarea id="bkOut" rows="3" readonly>${exportCode()}</textarea>
      <button class="pill" id="bkCopy">Salin kode</button>
      <textarea id="bkIn" rows="2" placeholder="Tempel kode cadangan di sini"></textarea>
      <button class="pill" id="bkLoad">Pulihkan dari kode</button>
      <div id="bkMsg"></div>
    </details>`;
}

function attachShopHandlers() {
  const $ = (id) => document.getElementById(id);
  const keepY = (fn) => () => { const y = window.scrollY; fn(); render(); window.scrollTo(0, y); };
  document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.nav;
    if (k === "shop") goShop(); else if (k === "inventory") goInventory(); else goMainMenu();
  }));
  if ($("btnCoins") && !$("btnCoins").classList.contains("static")) $("btnCoins").addEventListener("click", goShop);
  if ($("homeShop")) $("homeShop").addEventListener("click", goShop);
  if ($("homeAvatar")) $("homeAvatar").addEventListener("click", () => goInventory("icon"));
  if ($("homeContinue")) $("homeContinue").addEventListener("click", goKotobaSetup);
  document.querySelectorAll("[data-buy]").forEach(b => b.addEventListener("click", () => buyChest(b.dataset.buy)));
  document.querySelectorAll("[data-odds]").forEach(b => b.addEventListener("click", keepY(() => { state.shopOpen = state.shopOpen === b.dataset.odds ? null : b.dataset.odds; })));
  document.querySelectorAll("[data-invtab]").forEach(b => b.addEventListener("click", keepY(() => { state.invTab = b.dataset.invtab; })));
  document.querySelectorAll("[data-equip]").forEach(b => b.addEventListener("click", keepY(() => { SAVE.eq[state.invTab] = b.dataset.equip; saveSave(); })));
  document.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", keepY(() => {
    const st = SETS[Number(b.dataset.set)];
    SAVE.eq.warna = st.w; SAVE.eq.tampilan = st.t; SAVE.eq.bg = st.b; saveSave();
  })));
  if ($("bkCopy")) $("bkCopy").addEventListener("click", () => {
    const t = $("bkOut"); t.select();
    const done = () => { $("bkMsg").textContent = "Kode disalin."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand("copy"); done(); });
    else { document.execCommand("copy"); done(); }
  });
  if ($("bkLoad")) $("bkLoad").addEventListener("click", () => {
    if (importCode($("bkIn").value)) { BG_APPLIED = null; render(); }
    else $("bkMsg").textContent = "Kode tidak valid. Pastikan disalin lengkap.";
  });
}
Object.assign(state, { invTab: "warna", shopOpen: null, lastReward: null });
loadSave();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

loadPrefs();
jLoadPrefs();
render();

</script>
</body>
</html>
